name: womens-safety-openenv
version: 0.1.0
description: OpenEnv environment for women safety incident triage, dispatch, and policy-safe resolution.
author: Ritesh Kishor Bhogekar Team
license: MIT
tags:
  - openenv
  - women-safety
  - incident-response

api:
  base_path: /
  endpoints:
    reset: /reset
    step: /step
    state: /state
    tasks: /tasks
    grader: /grader
    baseline: /baseline

models:
  observation: src.env.models.Observation
  action: src.env.models.Action
  reward: src.env.models.Reward

tasks:
  - id: easy_incident_triage
    difficulty: easy
  - id: dispatch_queue_management
    difficulty: medium
  - id: high_risk_safe_resolution
    difficulty: hard
